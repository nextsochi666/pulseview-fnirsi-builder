- name: Build PulseView
  run: |
    git clone https://github.com/sigrokproject/pulseview.git
    cd pulseview
    mkdir build && cd build
    cmake .. -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/ucrt64 \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_AUTOMOC_COMPILER_PREDEFINES=OFF \
      -DCMAKE_NO_SYSTEM_FROM_IMPORTED=ON \
      -DENABLE_SIGNALS=OFF \
      -DCMAKE_CXX_FLAGS="-I/ucrt64/include -I/ucrt64/include/glibmm-2.4 -I/ucrt64/lib/glibmm-2.4/include -I/ucrt64/include/sigc++-2.0 -I/ucrt64/lib/sigc++-2.0/include -I/ucrt64/include/glib-2.0 -I/ucrt64/lib/glib-2.0/include"
    ninja

    echo "=== Поиск pulseview.exe ==="
    PV_EXE=$(find /d/a/pulseview-fnirsi-builder/pulseview-fnirsi-builder/pulseview/build -name "pulseview.exe" -type f | head -n 1)
    if [ -n "$PV_EXE" ]; then
      echo "Найден: $PV_EXE"
      mkdir -p /ucrt64/bin/pulseview-bundle
      cp "$PV_EXE" /ucrt64/bin/pulseview-bundle/
      echo "Скопирован в /ucrt64/bin/pulseview-bundle/"
      ls -la /ucrt64/bin/pulseview-bundle/
    else
      echo "pulseview.exe НЕ НАЙДЕН!"
      echo "=== Все exe в build ==="
      find /d/a/pulseview-fnirsi-builder/pulseview-fnirsi-builder/pulseview/build -name "*.exe" -type f || echo "EXE нет"
      exit 1
    fi
