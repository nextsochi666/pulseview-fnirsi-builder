name: Build PulseView with FNIRSI PR 306

on:
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Install MSYS2 and Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make cmake pkg-config check
            mingw-w64-x86_64-gcc mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools mingw-w64-x86_64-boost mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libzip mingw-w64-x86_64-glib2 mingw-w64-x86_64-glibmm

      - name: Clone, Patch and Build libsigrok (PR 306)
        shell: msys2 {0}
        run: |
          git clone https ://github.com/libsigrok.git
          cd libsigrok
          git fetch origin pull/306/head:fnirsi-fix
          git checkout fnirsi-fix
          mkdir build && cd build
          cmake -G "MSYS Makefiles" -DCMAKE_INSTALL_PREFIX=/mingw64 ..
          make -j$(nproc)
          make install

      - name: Clone and Build libsigrokdecode
        shell: msys2 {0}
        run: |
          git clone https ://github.com/sigrokproject/libsigrokdecode.git
          cd libsigrokdecode
          mkdir build && cd build
          cmake -G "MSYS Makefiles" -DCMAKE_INSTALL_PREFIX=/mingw64 ..
          make -j$(nproc)
          make install

      - name: Clone and Build PulseView
        shell: msys2 {0}
        run: |
          git clone https ://github.com/sigrokproject/pulseview.git
          cd pulseview
          mkdir build && cd build
          cmake -G "MSYS Makefiles" -DCMAKE_INSTALL_PREFIX=/mingw64 ..
          make -j$(nproc)
          make install

      - name: Prepare Artifacts for Download
        shell: msys2 {0}
        run: |
          mkdir -p /c/output
          cp /mingw64/bin/pulseview.exe /c/output/
          ntldd -R /mingw64/bin/pulseview.exe | grep -i "mingw64" | awk '{print $3}' | while read -r dll; do
            if [ -f "$dll" ]; then cp "$dll" /c/output/; fi
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseView-FNIRSI-Windows
          path: C:/output/
