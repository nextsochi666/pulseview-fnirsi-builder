- name: Build PulseView
  run: |
    git clone https://github.com/sigrokproject/pulseview.git
    cd pulseview
    mkdir build && cd build
    cmake .. -G Ninja \
      -DCMAKE_INSTALL_PREFIX=/ucrt64 \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_AUTOMOC_COMPILER_PREDEFINES=OFF \
      -DCMAKE_NO_SYSTEM_FROM_IMPORTED=ON \
      -DCMAKE_CXX_FLAGS="-I/ucrt64/include -I/ucrt64/include/glibmm-2.4 -I/ucrt64/lib/glibmm-2.4/include -I/ucrt64/include/glib-2.0 -I/ucrt64/lib/glib-2.0/include"
    ninja

    mkdir -p /ucrt64/bin/pulseview-bundle
    find . -name "pulseview.exe" -exec cp {} /ucrt64/bin/pulseview-bundle/ \;
    
