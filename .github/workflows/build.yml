name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project files
        id: detect
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-ChildItem "$env:GITHUB_WORKSPACE"

          $cmake = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "CMakeLists.txt" -File
          $sln = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "*.sln" -File
          $vcxproj = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "*.vcxproj" -File

          if ($cmake.Count -gt 0) {
            Write-Host "Found CMake project"
            "build_kind=cmake" >> $env:GITHUB_OUTPUT
            "cmake_path=$($cmake[0].DirectoryName)" >> $env:GITHUB_OUTPUT
          }
          elseif ($sln.Count -gt 0) {
            Write-Host "Found Visual Studio solution"
            "build_kind=msbuild" >> $env:GITHUB_OUTPUT
            "sln_path=$($sln[0].FullName)" >> $env:GITHUB_OUTPUT
          }
          elseif ($vcxproj.Count -gt 0) {
            Write-Host "Found vcxproj project"
            "build_kind=msbuild" >> $env:GITHUB_OUTPUT
            "vcxproj_path=$($vcxproj[0].FullName)" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "No CMakeLists.txt, .sln or .vcxproj found in this repository."
            "build_kind=none" >> $env:GITHUB_OUTPUT
          }

      - name: Setup build tools
        if: steps.detect.outputs.build_kind != 'none'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure with CMake
        if: steps.detect.outputs.build_kind == 'cmake'
        shell: pwsh
        run: |
          $src = $env:GITHUB_WORKSPACE
          $cmakeDir = ${{ steps.detect.outputs.cmake_path }}
          Write-Host "Configuring CMake from: $cmakeDir"
          cmake -S "$cmakeDir" -B "$src\build" -G "Ninja"
          cmake --build "$src\build" --config Release

      - name: Build Visual Studio solution
        if: steps.detect.outputs.build_kind == 'msbuild'
        shell: pwsh
        run: |
          if ("${{ steps.detect.outputs.sln_path }}" -ne "") {
            $sln = "${{ steps.detect.outputs.sln_path }}"
            Write-Host "Building solution: $sln"
            msbuild "$sln" /p:Configuration=Release /m
          }
          elseif ("${{ steps.detect.outputs.vcxproj_path }}" -ne "") {
            $proj = "${{ steps.detect.outputs.vcxproj_path }}"
            Write-Host "Building project: $proj"
            msbuild "$proj" /p:Configuration=Release /m
          }
          else {
            throw "No build target found"
          }

      - name: No project found
        if: steps.detect.outputs.build_kind == 'none'
        shell: pwsh
        run: |
          Write-Host "This repository does not contain a CMake project, .sln or .vcxproj."
          Write-Host "Action finished without build errors because there is nothing to compile here."
