name: Build PulseView with FNIRSI DLA-16

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git
          make
          cmake
          ninja
          pkg-config
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-glib2
          mingw-w64-x86_64-glibmm
          mingw-w64-x86_64-libzip
          mingw-w64-x86_64-libusb
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-qt5
          mingw-w64-x86_64-python

    # Шаг 1: Сборка libsigrok с патчем из PR #306
    - name: Build libsigrok with FNIRSI DLA-16 patch
      run: |
        # Клонируем репозиторий libsigrok
        git clone https://github.com/sigrokproject/libsigrok.git
        cd libsigrok
        
        # Скачиваем и применяем патч из PR #306
        # Используем API GitHub для получения diff файла
        curl -L https://github.com/sigrokproject/libsigrok/pull/306.diff -o pr306.diff
        git apply pr306.diff || (echo "Ошибка применения патча" && exit 1)
        
        # Сборка и установка
        ./autogen.sh
        ./configure --prefix=/mingw64 --disable-python
        make -j$(nproc)
        make install

    # Шаг 2: Сборка PulseView
    - name: Build PulseView
      run: |
        git clone https://github.com/sigrokproject/pulseview.git
        cd pulseview
        mkdir build && cd build
        cmake .. -G Ninja -DCMAKE_INSTALL_PREFIX=/mingw64 -DCMAKE_BUILD_TYPE=Release -DDISABLE_PYTHON=ON
        ninja
        # Копируем результат в удобное место
        mkdir -p /mingw64/bin/pulseview-bundle
        cp pulseview.exe /mingw64/bin/pulseview-bundle/ 2>/dev/null || cp *.exe /mingw64/bin/pulseview-bundle/

    # Шаг 3: Сбор зависимостей (DLL) для переносимой версии
    - name: Collect dependencies
      run: |
        cd /mingw64/bin/pulseview-bundle
        # windeployqt собирает Qt библиотеки
        windeployqt pulseview.exe || windeployqt *.exe
        # Копируем библиотеки sigrok и usb
        cp /mingw64/bin/libsigrok*.dll .
        cp /mingw64/bin/libusb*.dll .
        cp /mingw64/bin/libglib*.dll .
        cp /mingw64/bin/libgobject*.dll .
        cp /mingw64/bin/libgmodule*.dll .
        cp /mingw64/bin/libzip*.dll .
        cp /mingw64/bin/libstdc++*.dll .
        cp /mingw64/bin/libgcc_s_*.dll .
        cp /mingw64/bin/libwinpthread*.dll .

    # Шаг 4: Загрузка артефакта
    - name: Upload PulseView artifact
      uses: actions/upload-artifact@v4
      with:
        name: pulseview-fnirsi-dla16-win64
        path: /mingw64/bin/pulseview-bundle/
