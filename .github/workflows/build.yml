name: Build PulseView with FNIRSI DLA-16

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 (UCRT64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          make
          cmake
          ninja
          pkg-config
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-autotools
          mingw-w64-ucrt-x86_64-gettext
          mingw-w64-ucrt-x86_64-libtool
          mingw-w64-ucrt-x86_64-glib2
          mingw-w64-ucrt-x86_64-glibmm
          mingw-w64-ucrt-x86_64-libzip
          mingw-w64-ucrt-x86_64-libusb
          mingw-w64-ucrt-x86_64-boost
          mingw-w64-ucrt-x86_64-qt5-base
          mingw-w64-ucrt-x86_64-qt5-tools
          mingw-w64-ucrt-x86_64-doxygen
          mingw-w64-ucrt-x86_64-python

    - name: Build libsigrok with FNIRSI DLA-16 patch
      run: |
        git clone https://github.com/sigrokproject/libsigrok.git
        cd libsigrok

        curl -L https://github.com/sigrokproject/libsigrok/pull/306.diff -o pr306.diff
        git apply pr306.diff || (echo "Ошибка применения патча" && exit 1)

        if [ -x ./configure ]; then
          echo "configure уже есть, пропускаем autogen"
        else
          ./autogen.sh
        fi

        ./configure --prefix=/ucrt64
        make -j$(nproc)
        make install

        # Проверяем, что libsigrokcxx действительно установлен
        if [ ! -f /ucrt64/lib/pkgconfig/libsigrokcxx.pc ]; then
          echo "libsigrokcxx.pc не найден! Сборка C++ биндингов провалилась."
          exit 1
        fi

    - name: Build PulseView
      run: |
        git clone https://github.com/sigrokproject/pulseview.git
        cd pulseview
        mkdir build && cd build
        cmake .. -G Ninja \
          -DCMAKE_INSTALL_PREFIX=/ucrt64 \
          -DCMAKE_BUILD_TYPE=Release
        ninja

        mkdir -p /ucrt64/bin/pulseview-bundle
        cp pulseview.exe /ucrt64/bin/pulseview-bundle/

    - name: Collect dependencies
      run: |
        cd /ucrt64/bin/pulseview-bundle
        windeployqt pulseview.exe || windeployqt *.exe

        cp /ucrt64/bin/libsigrok*.dll        . || true
        cp /ucrt64/bin/libsigrokcxx*.dll     . || true
        cp /ucrt64/bin/libusb*.dll           . || true
        cp /ucrt64/bin/libglib*.dll          . || true
        cp /ucrt64/bin/libgobject*.dll       . || true
        cp /ucrt64/bin/libgmodule*.dll       . || true
        cp /ucrt64/bin/libgio*.dll           . || true
        cp /ucrt64/bin/libzip*.dll           . || true
        cp /ucrt64/bin/libstdc++*.dll        . || true
        cp /ucrt64/bin/libgcc_s_*.dll        . || true
        cp /ucrt64/bin/libwinpthread*.dll    . || true
        cp /ucrt64/bin/libglibmm*.dll        . || true

    - name: Upload PulseView artifact
      uses: actions/upload-artifact@v4
      with:
        name: pulseview-fnirsi-dla16-win64
        path: /ucrt64/bin/pulseview-bundle/
