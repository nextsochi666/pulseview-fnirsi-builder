name: Build PulseView with FNIRSI DLA-16

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2 (UCRT64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          make
          cmake
          ninja
          pkg-config
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-autotools
          mingw-w64-ucrt-x86_64-gettext
          mingw-w64-ucrt-x86_64-libtool
          mingw-w64-ucrt-x86_64-glib2
          mingw-w64-ucrt-x86_64-glibmm
          mingw-w64-ucrt-x86_64-libsigc++
          mingw-w64-ucrt-x86_64-libzip
          mingw-w64-ucrt-x86_64-libusb
          mingw-w64-ucrt-x86_64-boost
          mingw-w64-ucrt-x86_64-qt5-base
          mingw-w64-ucrt-x86_64-qt5-tools
          mingw-w64-ucrt-x86_64-qt5-svg
          mingw-w64-ucrt-x86_64-doxygen
          mingw-w64-ucrt-x86_64-python

    - name: Build libsigrok with FNIRSI DLA-16 patch
      run: |
        git clone https://github.com/sigrokproject/libsigrok.git
        cd libsigrok

        curl -L https://github.com/sigrokproject/libsigrok/pull/306.diff -o pr306.diff
        git apply pr306.diff || (echo "Ошибка применения патча" && exit 1)

        if [ -x ./configure ]; then
          echo "configure уже есть, пропускаем autogen"
        else
          ./autogen.sh
        fi

        ./configure --prefix=/ucrt64
        make -j$(nproc)
        make install

        if [ ! -f /ucrt64/lib/pkgconfig/libsigrokcxx.pc ]; then
          echo "libsigrokcxx.pc не найден! Сборка C++ биндингов провалилась."
          exit 1
        fi

    - name: Build libsigrokdecode (with static Python)
      run: |
        git clone https://github.com/sigrokproject/libsigrokdecode.git
        cd libsigrokdecode

        if [ -x ./configure ]; then
          echo "configure уже есть, пропускаем autogen"
        else
          ./autogen.sh
        fi

        # Указываем configure, что Python нужно встроить (статически)
        # и жестко прописываем пути к библиотекам внутри MSYS2
        ./configure --prefix=/ucrt64 \
            PYTHON_CPPFLAGS="-I/ucrt64/include/python3.14" \
            PYTHON_LDFLAGS="-L/ucrt64/lib -lpython3.14" \
            --enable-static
            
        make -j$(nproc)
        make install

        if [ ! -f /ucrt64/lib/pkgconfig/libsigrokdecode.pc ]; then
          echo "libsigrokdecode.pc не найден! Сборка провалилась."
          exit 1
        fi

    - name: Build PulseView
      run: |
        git clone https://github.com/sigrokproject/pulseview.git
        cd pulseview
        mkdir build && cd build
        cmake .. -G Ninja \
          -DCMAKE_INSTALL_PREFIX=/ucrt64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_AUTOMOC_COMPILER_PREDEFINES=OFF \
          -DCMAKE_NO_SYSTEM_FROM_IMPORTED=ON \
          -DENABLE_SIGNALS=OFF \
          -DCMAKE_CXX_FLAGS="-I/ucrt64/include -I/ucrt64/include/glibmm-2.4 -I/ucrt64/lib/glibmm-2.4/include -I/ucrt64/include/sigc++-2.0 -I/ucrt64/lib/sigc++-2.0/include -I/ucrt64/include/glib-2.0 -I/ucrt64/lib/glib-2.0/include"
        ninja

    - name: Collect dependencies
      run: |
        mkdir -p "$GITHUB_WORKSPACE/pulseview-artifact"
        cd "$GITHUB_WORKSPACE/pulseview-artifact"
        
        echo "=== Поиск pulseview.exe ==="
        PV_EXE=$(find "$GITHUB_WORKSPACE" -name "pulseview.exe" -type f | head -n 1)
        
        if [ -n "$PV_EXE" ]; then
          echo "Найден: $PV_EXE"
          cp "$PV_EXE" .
        else
          echo "pulseview.exe НЕ НАЙДЕН!"
          exit 1
        fi

        WINDEPLOYQT=$(find /ucrt64/bin -name "windeployqt*.exe" | head -n 1)
        if [ -n "$WINDEPLOYQT" ]; then
          "$WINDEPLOYQT" --no-opengl-sw pulseview.exe || true
        fi

        # Копируем все нужные DLL
        cp /ucrt64/bin/libsigrok*.dll        . || true
        cp /ucrt64/bin/libsigrokcxx*.dll     . || true
        cp /ucrt64/bin/libsigrokdecode*.dll  . || true
        cp /ucrt64/bin/libusb*.dll           . || true
        cp /ucrt64/bin/libglib*.dll          . || true
        cp /ucrt64/bin/libgobject*.dll       . || true
        cp /ucrt64/bin/libgmodule*.dll       . || true
        cp /ucrt64/bin/libgio*.dll           . || true
        cp /ucrt64/bin/libzip*.dll           . || true
        cp /ucrt64/bin/libstdc++*.dll        . || true
        cp /ucrt64/bin/libgcc_s_*.dll        . || true
        cp /ucrt64/bin/libwinpthread*.dll    . || true
        cp /ucrt64/bin/libglibmm*.dll        . || true
        cp /ucrt64/bin/libsigc*.dll          . || true
        cp /ucrt64/bin/Qt5Svg.dll            . || true
        
        cp /ucrt64/bin/zlib1.dll             . || true
        cp /ucrt64/bin/libicuin*.dll         . || true
        cp /ucrt64/bin/libicuuc*.dll         . || true
        cp /ucrt64/bin/libicudt*.dll         . || true
        cp /ucrt64/bin/libdouble-conversion.dll . || true
        cp /ucrt64/bin/libpython*.dll        . || true
        
        mkdir -p platforms
        QWINDOWS=$(find /ucrt64 -name "qwindows.dll" 2>/dev/null | head -n 1)
        if [ -n "$QWINDOWS" ]; then
          cp "$QWINDOWS" platforms/
        fi
        mkdir -p styles
        cp /ucrt64/share/qt5/plugins/styles/*.dll styles/ || true
        mkdir -p imageformats
        cp /ucrt64/share/qt5/plugins/imageformats/qsvg.dll imageformats/ || true

        # Копируем декодеры
        mkdir -p decoders
        cp -r /ucrt64/share/libsigrokdecode/decoders/* decoders/ || true

        echo "=== Итоговое содержимое артефакта ==="
        ls -la

    - name: Upload PulseView artifact
      uses: actions/upload-artifact@v4
      with:
        name: pulseview-fnirsi-dla16-win64
        path: pulseview-artifact/
